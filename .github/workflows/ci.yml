# Goal - I have to Lint, Build, Test the code for Frontend and Backend and then Push the built images to DockerHub.

name: CI

on:
    push:
        branches: [advanced]

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
              
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: 20
                cache: "npm"
                cache-dependency-path: frontend/package-lock.json
            
            - name: Install npm Packages
              run: npm install
              working-directory: frontend

            - name: Run Lint
              run: npm run lint
              working-directory: frontend  

            - name: Run Tests
              run: npm run test
              working-directory: frontend

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest

    backend:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: go setup
              uses: actions/setup-go@v7
              with:
                go-version: 1.23
                go-version-file: go.mod
                cache-dependency-path: go.sum
            
            - name: Run Go Formatter
              run: go fmt
              working-directory: backend

            - name: Run Go Vet
              run: go vet
              working-directory: backend

            - name: Run Go Tests
              run: go test
              working-directory: backend  

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest




